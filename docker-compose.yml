services:
  scoreboard:
    build: .
    image: biph:0.1.0
    container_name: biph
    restart: unless-stopped
    ports:
      # 局域网访问:把 8080 映射出来即可
      # 如果校园网开启了 AP 隔离,手机访问不到映射端口,
      # 改用 network_mode: host(见下方注释)或接独立热点。
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      # iPad 的 PWA 与 Wake Lock 都要求安全上下文,默认开启 HTTPS(自签证书)
      HTTPS: "true"
      # 自签证书的 SAN 里额外要包含的域名/IP,逗号分隔
      # 例:CERT_NAMES: "scoreboard.school.edu,192.168.1.20"
      CERT_NAMES: "${CERT_NAMES:-}"
      # 管理员密钥:留空即用默认值 1818(防误触用的闸门,不是安全边界);想更严就填自己的
      ADMIN_KEY: "${ADMIN_KEY:-}"
      LOG_LEVEL: info
    volumes:
      # SQLite 数据库 / Logo / 自签证书 都持久化在这里
      - biph-data:/data
    # --- 可选:host 网络模式(Linux 专用)---
    # 取消下面两行的注释并注释掉 ports,可让容器直接使用宿主机网络,
    # 在有 AP 隔离的校园网里更容易被手机访问到。
    # network_mode: host
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  biph-data:
